name: Build & Deploy — BIG-i Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite disparar manualmente desde GitHub UI

concurrency:
  group: production-deploy
  cancel-in-progress: true # Cancela deploy anterior si hay uno en curso

jobs:
  deploy-vanilla:
    name: Deploy Vanilla HTML via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ------------------------------------------------------------------ #
      # 1. CHECKOUT DEL CÓDIGO                                             #
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. DEPLOY VIA FTP A BLUEHOST (big-i.com.mx)                        #
      # ------------------------------------------------------------------ #
      - name: Deploy to production via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.big-i.com.mx
          port: 21
          username: deploy@big-i.com.mx
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          # 🚨 EXCLUSIONES CRÍTICAS (No subir esto al servidor público)
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            knowledge/**
            Background/**
            **/.env*
            **/logs/**
            README.md

      # ------------------------------------------------------------------ #
      # 3. NOTIFICACIÓN DE RESULTADO                                       #
      # ------------------------------------------------------------------ #
      - name: Deploy summary
        if: success()
        run: |
          echo "=========================================="
          echo "  DEPLOY VANILLA EXITOSO — big-i.com.mx"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Autor:  ${{ github.actor }}"
          echo "=========================================="